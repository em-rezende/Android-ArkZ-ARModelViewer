name: Bug
description: Algo não funciona como esperado
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Antes de enviar, confira a seção **Solução de problemas** do
        [README](https://github.com/em-rezende/Android-ArkZ-ARModelViewer#solu%C3%A7%C3%A3o-de-problemas)
        e se você está na versão mais recente das
        [releases](https://github.com/em-rezende/Android-ArkZ-ARModelViewer/releases).
  - type: textarea
    id: o_que_aconteceu
    attributes:
      label: O que aconteceu
      description: Descreva o comportamento observado e o que você esperava que acontecesse.
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Passos para reproduzir
      placeholder: |
        1. Abrir o app
        2. Carregar o modelo X (formato e tamanho)
        3. Apontar para o marcador A
        4. ...
    validations:
      required: true
  - type: input
    id: versao_app
    attributes:
      label: Versão do app
      description: Está em menu ⋮ → Sobre (ou em menu ⋮ → Copiar diagnóstico).
      placeholder: "1.0.0 (1)"
    validations:
      required: true
  - type: input
    id: aparelho
    attributes:
      label: Aparelho e Android
      placeholder: "Samsung Galaxy S22 — Android 14 (API 34)"
    validations:
      required: true
  - type: input
    id: modelo_marcador
    attributes:
      label: Modelo e marcador usados
      description: Formato do arquivo (.glb/.gltf/.obj/.ply/.stl/.3mf), tamanho aproximado e qual marcador (A, B ou personalizado).
    validations:
      required: false
  - type: textarea
    id: logcat
    attributes:
      label: Logcat
      description: Saída de `adb logcat -s ArkZARModelViewer` durante o problema.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: confirmacoes
    attributes:
      label: Confirmações
      options:
        - label: Li a seção "Solução de problemas" do README e não encontrei o meu caso.
          required: true
        - label: Estou usando a versão mais recente do app.
          required: false
