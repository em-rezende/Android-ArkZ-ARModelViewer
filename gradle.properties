org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# O AGP 9 traz suporte a Kotlin embutido e, por padrão, proíbe o plugin
# `org.jetbrains.kotlin.android`. Como usamos o plugin Kotlin "clássico"
# (necessário para o plugin do compilador Compose e para configurar o jvmTarget
# no bloco `kotlin { }`), desativamos o Kotlin embutido — exatamente como faz o
# próprio projeto do SceneView (§ gradle.properties do repositório oficial).
# `android.newDsl=false` acompanha essa escolha: o plugin Kotlin ainda não
# suporta a nova DSL do AGP 9.
android.builtInKotlin=false
android.newDsl=false

# O uso do plugin Kotlin "clássico" no AGP 9 gera avisos informativos de
# deprecação na sincronização. Como a migração para o Kotlin embutido do AGP
# ainda não cobre o plugin do compilador Compose usado aqui, os avisos ficam
# suprimidos para não poluir o build.
android.sync.suppressAgpWarnings=DEPRECATED_DSL

kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
