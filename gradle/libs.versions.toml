# Catalogo de versoes centralizado (Gradle Version Catalog).
# Todas as versoes abaixo foram alinhadas com o SceneView 4.38.0, que exige
# Kotlin 2.4.x, compileSdk 37 e Compose BOM 2026.09.x.

[versions]
# Ferramentas de build
agp = "9.4.0"
kotlin = "2.4.10"

# AndroidX
coreKtx = "1.18.0"
activityCompose = "1.13.0"
lifecycleRuntimeCompose = "2.10.0"

# Compose
composeBom = "2026.09.00"

# Kotlin libraries
coroutines = "1.11.0"

# 3D / RA
sceneview = "4.38.0"
arCore = "1.54.0"

[libraries]
# AndroidX core / lifecycle
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeCompose" }

# Compose (versoes controladas pelo BOM)
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# Kotlin coroutines
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# SceneView (RA + renderizacao 3D) e ARCore (deteccao de marcadores)
sceneview-arsceneview = { group = "io.github.sceneview", name = "arsceneview", version.ref = "sceneview" }
google-arcore = { group = "com.google.ar", name = "core", version.ref = "arCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
